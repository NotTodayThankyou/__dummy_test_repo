name: Close PRs from Forks that didn't run CI

on:
  pull_request_target:
    types: [opened, reopened]
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: NotTodayThankyou/NotTodayThankyou@v1
        with:
          close-message: "❌ **PR Automatically Closed**: Workflows have not been executed on your fork."
          post-comment: "true"
          allowed-authors: "JamesParrott-machine-account"
          max-prs-per-day: "-1"
          require-associated-issue: "false"
